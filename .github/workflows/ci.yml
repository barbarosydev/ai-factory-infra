# Runs the same `task ci` as pre-commit, on every pull request and on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: 3.54.0
  TFLINT_VERSION: v0.66.0
  GITLEAKS_VERSION: 8.30.1
  SHELLCHECK_VERSION: 0.11.0

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Read the Terraform pin
        id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - uses: go-task/setup-task@v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$url/$tarball"
          curl -fsSL "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Install shellcheck
        # The runner's shellcheck is older and reports different warnings; pin the Mac's version.
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Tool versions
        run: |
          terraform version | head -n1
          tflint --version | head -n1
          task --version
          gitleaks version
          shellcheck --version | sed -n 2p
          jq --version
          yq --version

      - name: task ci
        run: task ci
