# Runs the same `task ci` as pre-commit, on every pull request and on main.
# Tool versions come from mise.toml, the same file the Mac uses.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      # Installs the tools `task ci` needs at the versions in mise.toml and puts them on PATH.
      # The cluster tools (k3d, kubectl, helm, temporal) and pre-commit are not needed here.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: terraform tflint terraform-docs conftest task jq yq shellcheck ruff actionlint gitleaks

      - name: Tool versions
        run: mise ls --current

      - name: task ci
        run: task ci
