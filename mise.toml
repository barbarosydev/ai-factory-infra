# The one place where command line tool versions are pinned (hard rule 6).
# The Mac and GitHub Actions both install exactly these with `mise install`.
# Scripts put them on PATH themselves (scripts/lib/common.sh), so no shell setup is needed.
# Bump a version with the upgrade-version skill; `task doctor:prereqs` fails on a mismatch.
# Docker Desktop and Ollama are desktop apps and are checked against minimum versions instead.

[tools]
# Cluster
k3d = "5.9.0"
kubectl = "1.37.2"
helm = "4.3.2"

# Infrastructure as code
terraform = "1.17.2"
tflint = "0.66.0"
terraform-docs = "0.25.1"
conftest = "0.71.1"

# Task runner and scripts
task = "3.54.0"
jq = "1.8.2"
yq = "4.54.3"
shellcheck = "0.11.0"
ruff = "0.17.5"
actionlint = "1.7.12"

# Checks before commit
pre-commit = "4.7.0"
gitleaks = "8.30.1"

# Temporal CLI, used by task doctor
temporal = "1.10.1"
