# Thin task runner: every task calls one script in scripts/, where the logic lives.
# `task --list` prints every task with its description.
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Start Ollama, check prerequisites, create or resume the cluster, and apply Terraform
    cmds:
      - ./scripts/up.sh

  plan:
    desc: Run Terraform plan for the local environment
    cmds:
      - ./scripts/terraform.sh plan {{.CLI_ARGS}}

  apply:
    desc: Apply Terraform for the local environment
    cmds:
      - ./scripts/terraform.sh apply {{.CLI_ARGS}}

  down:
    desc: Stop the cluster and unload Ollama models; all data is kept
    cmds:
      - ./scripts/down.sh

  restart:
    desc: down, then up
    cmds:
      - ./scripts/down.sh
      - ./scripts/up.sh

  stop:cluster:
    desc: Stop only the k3d cluster; data is kept
    cmds:
      - ./scripts/cluster-stop.sh

  stop:ollama:
    desc: Unload models and quit only Ollama
    cmds:
      - ./scripts/ollama.sh stop

  status:
    desc: Show the cluster, pods, loaded models and URLs
    cmds:
      - ./scripts/status.sh

  access:
    desc: "Show UIs, secret names and API commands; task access -- --copy <master|pm-agent|dev-agent|sec-agent> copies a key to clipboard"
    cmds:
      - ./scripts/access.sh {{.CLI_ARGS}}

  clean:
    desc: Delete the cluster, the project kubeconfig and Terraform state; databases are lost
    prompt: This deletes the ai-factory cluster and all its data. Continue?
    cmds:
      - ./scripts/cluster-clean.sh

  clean:all:
    desc: Delete the cluster, Terraform state and caches, and optionally remove the Ollama models
    prompt: This deletes the ai-factory cluster, Terraform state and caches. Continue?
    cmds:
      - ./scripts/clean-all.sh {{.CLI_ARGS}}

  doctor:
    desc: Full health check across prerequisites, cluster, Postgres, Ollama, LiteLLM, Temporal and Web UIs
    cmds:
      - ./scripts/doctor.sh {{.CLI_ARGS}}

  state:check:
    desc: Check that Terraform state holds no secret values (prints a count only)
    cmds:
      - ./scripts/state-check.sh {{.CLI_ARGS}}

  smoke:cluster:
    desc: "Cluster smoke test; task smoke:cluster -- --lifecycle also runs down and up"
    cmds:
      - ./tests/smoke/cluster.sh {{.CLI_ARGS}}

  smoke:postgres:
    desc: PostgreSQL operator, cluster, databases and per-role login isolation check
    cmds:
      - ./tests/smoke/postgres.sh {{.CLI_ARGS}}

  smoke:litellm:
    desc: LiteLLM gateway, Admin UI, model completions and per-agent virtual key scope check
    cmds:
      - ./tests/smoke/litellm.sh {{.CLI_ARGS}}

  smoke:temporal:
    desc: Temporal deployments, schema/namespace Jobs, gRPC health, Mac sample workflow and Web UI check
    cmds:
      - ./tests/smoke/temporal.sh {{.CLI_ARGS}}

  doctor:prereqs:
    desc: Check tools, versions, Docker resources, Ollama models, proxy and free ports
    cmds:
      - ./scripts/doctor-prereqs.sh {{.CLI_ARGS}}

  lint:
    desc: terraform fmt, validate and tflint; shellcheck; JSON and YAML syntax
    cmds:
      - ./scripts/lint.sh

  ci:
    desc: task lint, the hook tests and a gitleaks secret scan; pre-commit and GitHub Actions both run it
    cmds:
      - ./scripts/ci.sh {{.CLI_ARGS}}

  kube:
    desc: "Run kubectl against the project kubeconfig only, e.g. task kube -- get pods -A"
    cmds:
      - ./scripts/kube.sh {{.CLI_ARGS}}
